# Local Odoo Community for testing the Odoo connector (test credentials only).
# Start: docker compose -f odoo/docker-compose.yml up -d   ->  http://localhost:8069
# The IsAIWorthIt module in odoo_module/ is mounted as an add-on; install it under Apps.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo-local-only
    volumes:
      - odoo-db:/var/lib/postgresql/data
  odoo:
    image: odoo:18
    depends_on: [db]
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo-local-only
    volumes:
      - odoo-data:/var/lib/odoo
      - ../odoo_module:/mnt/extra-addons
volumes:
  odoo-db:
  odoo-data:
